name: Daily Data Update

on:
  schedule:
    - cron: '0 1 * * *'   # 매일 오전 10시(KST)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: 데이터 수집 및 스코어링
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: |
          python collect_and_score.py

      - name: 생성된 파일 확인
        run: |
          ls -lh
          test -f JobLens_Scores.csv && echo "CSV exists"

      - name: CSV 자동 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add JobLens_Scores.csv

          git status

          git commit -m "data: 채용공고 자동 업데이트 $(date '+%Y-%m-%d')" || echo "No changes to commit"

          git push

      - name: Render 재배포 트리거
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
