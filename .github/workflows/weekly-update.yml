name: Daily Data Update

on:
  schedule:
    - cron: '0 1 * * *'   # 매일 오전 10시 (KST = UTC+9, 01:00 UTC)
  workflow_dispatch:        # 수동 실행 버튼도 활성화

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests pandas

      - name: 데이터 수집 및 스코어링
        run: python scripts/collect_and_score.py
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}

      - name: CSV 변경 여부 확인
        id: check
        run: |
          git diff --quiet JobLens_Scores.csv && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: CSV 자동 커밋
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add JobLens_Scores.csv
          git commit -m "data: 주간 채용공고 데이터 자동 업데이트 $(date '+%Y-%m-%d')"
          git push

      - name: Render 재배포 트리거
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
