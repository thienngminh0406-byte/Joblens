
name: Daily Data Update - TEST

on:
  schedule:
    - cron: '0 0 * * *'   # 오전 9시(KST)
    - cron: '0 3 * * *'   # 오후 12시(KST)
  workflow_dispatch:

concurrency:
  group: joblens-test-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          ref: feature/keyword-trend
          fetch-depth: 0

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 및 스코어링
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: |
          python scripts/collect_and_score.py

      - name: Git 상태 확인
        run: |
          git status
          ls -lh
          md5sum JobLens_Scores.csv
          git diff --stat

      - name: CSV 자동 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JobLens_Scores.csv keyword_trends.csv pension_salary_cache.csv

          git commit -m "data: TEST 채용공고 자동 업데이트 $(date '+%Y-%m-%d')" || echo "No changes to commit"

          git fetch origin feature/keyword-trend
          git rebase origin/feature/keyword-trend
          git push origin HEAD:feature/keyword-trend

     
      - name: Render 재배포 트리거
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL_TEST }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK_URL_TEST is not configured."
            exit 1
          fi

          curl -fS -X POST "$RENDER_HOOK"

